<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DialogJS Feature Showcase</title>
    <link rel="stylesheet" href="style/appearance.css">
    <link rel="stylesheet" href="style/main.css">
</head>
<body>
    <main>
        <div id="intro">
            <h1>DialogJS Feature Showcase</h1>
            <p class="intro-hint">
                Click / Space / Enter: Skip or Advance &bull; Hold Ctrl: Fast-Forward &bull; L / Esc: History Log &bull; Arrows / W / S / Wheel: Select
            </p>
            <div class="intro-features">
                <span>Multi-Speaker Beats</span>
                <span>Inline Pauses &amp; Speed</span>
                <span>Sprite Focus &amp; Tweens</span>
                <span>CSS Variable Themes</span>
                <span>Auto / Skip HUD</span>
                <span>Save &amp; Load Snapshot</span>
            </div>
            <button type="button" id="startDemoBtn">Start Showcase</button>
        </div>
    </main>
    <script src="script/dialog.js"></script>
    <script src="script/main.js"></script>
</body>
</html>
